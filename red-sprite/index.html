<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Red Sprites over the Village — painted with code</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050506;
        color: #a9a39b;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 18px;
        box-sizing: border-box;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 86px);
        width: auto;
        height: auto;
        background: #08080a;
        box-shadow: 0 18px 80px rgba(0, 0, 0, 0.7);
      }
      .bar {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      button {
        font: inherit;
        color: #f1e6da;
        background: #1b1514;
        border: 1px solid #3a2a26;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #2a1b18;
        border-color: #6b2a22;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #png {
        display: none;
      }
      body.export main {
        padding: 0;
      }
      body.export .bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="art" width="819" height="1024"></canvas>
      <div class="bar">
        <span id="status">Loading…</span>
        <button id="save" disabled>Download PNG</button>
        <button id="reseed" disabled>New variation</button>
      </div>
    </main>
    <pre id="png"></pre>
    <script src="js/util.js"></script>
    <script src="js/sky.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/village.js"></script>
    <script src="js/post.js"></script>
    <script src="js/anim.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
